<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chuutiiiiii ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--red:#e10600;--serif:"Cormorant Garamond","Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#fff;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;user-select:none;-webkit-user-select:none}
  .stage{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:#000;cursor:pointer}

  /* photo sits underneath everything */
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 28%;filter:contrast(1.08) brightness(.92);transform:scale(1.14)}
  .stage.open .photo{animation:settle 3s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes settle{to{transform:scale(1)}}
  .shade{position:absolute;inset:0;pointer-events:none;background:
    linear-gradient(to top,#000 8%,rgba(0,0,0,.86) 30%,rgba(0,0,0,0) 58%),linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,0) 18%)}
  .grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* ---------- Front page: a blurred memory ---------- */
  .intro{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
    transition:background 2s ease,-webkit-backdrop-filter 2s ease,backdrop-filter 2s ease}
  .intro.clear{background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);pointer-events:none}
  .intro-in{display:flex;flex-direction:column;align-items:center;gap:20px;transition:opacity .6s ease,transform .6s ease}
  .intro.clear .intro-in{opacity:0;transform:scale(.96)}
  .kicker{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:#cfcfcf;opacity:0;animation:fade 1.2s .3s forwards}
  .draw{width:118px;overflow:visible;filter:drop-shadow(0 0 18px rgba(225,6,0,.55))}
  .draw path{fill:rgba(225,6,0,0);stroke:var(--red);stroke-width:.9;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation:trace 2.6s .5s cubic-bezier(.6,0,.3,1) forwards,fill 1s 2.6s forwards,beat 1.7s 3.6s ease-in-out infinite;transform-origin:50% 55%}
  @keyframes trace{to{stroke-dashoffset:0}}
  @keyframes fill{to{fill:rgba(225,6,0,1)}}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%{transform:scale(1)}}
  .big{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(3rem,16vw,4.6rem);line-height:1;letter-spacing:.01em;
    opacity:0;animation:fade 1.4s 1.4s forwards}
  .sub{font-weight:300;font-size:.9rem;letter-spacing:.08em;color:#a8a8a8;opacity:0;animation:fade 1.2s 2s forwards}
  .btn{margin-top:14px;display:inline-flex;align-items:center;gap:12px;appearance:none;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.04);
    color:#fff;font:400 .95rem var(--sans);letter-spacing:.14em;padding:16px 34px;border-radius:999px;cursor:pointer;
    opacity:0;animation:fade 1.2s 2.8s forwards;transition:background .25s,color .25s,transform .2s}
  .btn svg{width:15px;fill:var(--red)}
  .btn:hover{background:#fff;color:#000}.btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:4px}
  @keyframes fade{to{opacity:1}}

  /* ---------- After opening ---------- */
  .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 26px calc(env(safe-area-inset-bottom,0px) + 38px);text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;opacity:0}
  .stage.open .copy{opacity:1}
  .name{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2.7rem,15vw,4.3rem);line-height:1;display:flex;align-items:center;white-space:nowrap}
  .name .l{display:inline-block;opacity:0;transform:translateY(.5em)}
  .stage.open .name .l{animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .name svg{width:.4em;margin-left:.2em;fill:var(--red);opacity:0;filter:drop-shadow(0 0 12px rgba(225,6,0,.7))}
  .stage.open .name svg{animation:pop .6s 1.9s cubic-bezier(.3,1.6,.5,1) forwards,beat 1.7s 2.6s ease-in-out infinite}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .msg{min-height:5.4em;max-width:29ch;font-weight:300;font-size:1rem;line-height:1.7;color:#e2e2e2;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .9s ease}
  .msg.on{opacity:1}
  .love{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:#fff;opacity:0}
  .stage.open .love{animation:fade 1.2s 2.4s forwards}
  .sign{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-style:italic;font-size:1rem;color:#9a9a9a;opacity:0}
  .stage.open .sign{animation:fade 1.2s 3s forwards}
  .sign::before,.sign::after{content:"";width:34px;height:1px;background:rgba(255,255,255,.3)}

  .fly{position:fixed;width:26px;fill:var(--red);pointer-events:none;z-index:9;animation:up 1.8s ease-out forwards;filter:drop-shadow(0 0 8px rgba(225,6,0,.6))}
  @keyframes up{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-260px) scale(1.2)}}

  @media (max-height:640px){.draw{width:90px}.msg{min-height:4.6em;font-size:.92rem}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.photo{transform:none}}
</style>
</head>

  <div class="shade"></div><div class="grain"></div>

  <div class="copy">
    <h1 class="name" id="name" aria-label="Chuutiiiiii"></h1>
    <p class="msg" id="msg"></p>
    <p class="love">I love you, today and always.</p>
    <p class="sign">Your loving Chuuti Putha</p>
  </div>

  <main class="intro" id="intro">
    <div class="intro-in">
      <svg class="draw" viewBox="-1 0 26 23" aria-hidden="true"><path pathLength="1" d="M12 21.5C-6 9 3.5-1 12 5.2 20.5-1 30 9 12 21.5Z"/></svg>
      <h2 class="big">Chuutiiiiii</h2>
      <p class="sub">a little something from my heart</p>
      <button class="btn" id="open"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.5C-6 9 3.5-1 12 5.2 20.5-1 30 9 12 21.5Z"/></svg>TAP TO OPEN</button>
    </div>
  </main>
</div>

<script>
  const HEART='<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.5C-6 9 3.5-1 12 5.2 20.5-1 30 9 12 21.5Z"/></svg>';
  const stage=document.getElementById('stage'), msg=document.getElementById('msg');
  document.getElementById('name').innerHTML=[...'Chuutiiiiii'].map((c,i)=>`<span class="l" style="animation-delay:${.9+i*.09}s">${c}</span>`).join('')+HEART;

  const lines=[
    "From the moment you came into my life, everything became softer, warmer, and more beautiful.",
    "Your smile is my favourite place to come home to.",
    "With you, even the quiet moments feel like my favourite ones.",
    "I fall for you a little more every single day.",
    "You are my today, my tomorrow, and all my forevers."
  ];
  let n=0;
  function show(){msg.textContent=lines[n%lines.length];msg.classList.add('on');n++;
    setTimeout(()=>{msg.classList.remove('on');setTimeout(show,900)},4600)}

  let opened=false;
  document.getElementById('open').addEventListener('click',e=>{
    e.stopPropagation();opened=true;
    document.getElementById('intro').classList.add('clear');
    setTimeout(()=>stage.classList.add('open'),500);
    setTimeout(show,2600);
  });

  stage.addEventListener('pointerdown',e=>{
    if(!opened)return;
    for(let k=0;k<3;k++){
      const s=document.createElement('div');s.innerHTML=HEART;const h=s.firstChild;h.setAttribute('class','fly');
      h.style.left=(e.clientX+(Math.random()*40-20))+'px';h.style.top=(e.clientY+(Math.random()*20-10))+'px';
      h.style.setProperty('--dx',(Math.random()*80-40)+'px');h.style.animationDelay=(k*.12)+'s';
      document.body.appendChild(h);setTimeout(()=>h.remove(),2100);
    }
  });
</script>
